# H2 in-memory profile used ONLY for sandbox/CI smoke tests (mvn test).
spring.datasource.url=jdbc:h2:mem:mediflowtest;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:NT2005}
# Build the schema from JPA mappings (MySQL-compatible mode) so tests run without MySQL
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=true

# Seed demo data for sandbox preview runs (real deployments use database/mediflow.sql)
mediflow.demo-data=true
