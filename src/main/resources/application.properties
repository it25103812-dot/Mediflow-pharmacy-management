# =====================================================================
# MediFlow Backend - MySQL configuration (development)
# 1. Create DB:      mysql -u root -p < database/mediflow.sql
# 2. Run backend:    mvn spring-boot:run   (from project root)
# =====================================================================
spring.application.name=mediflow-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mediflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:NT2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is created by database/mediflow.sql - validate only, never auto-modify
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# Show nice SQL params in logs when debugging
logging.level.org.hibernate.SQL=INFO

# ---- JWT settings (change jwt.secret for any real deployment) ----
mediflow.jwt.secret=mediflow-dev-secret-key-change-me-in-production-0123456789abcdef
mediflow.jwt.expiration-ms=86400000

# ---- CORS (Vite dev server) ----
mediflow.cors.allowed-origins=http://localhost:5173,http://localhost:3000

spring.servlet.multipart.max-file-size=5MB
spring.mvc.throw-exception-if-no-handler-found=true

# Actuator-style error body always JSON
server.error.whitelabel.enabled=false
